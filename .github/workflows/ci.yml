name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Verify toolchain
        run: |
          node --version
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck (web)
        run: pnpm typecheck:web
      - name: Typecheck (server)
        run: pnpm typecheck:server
      - name: Lint
        run: pnpm lint
      - name: Tests
        run: pnpm test
      - name: Build web app
        run: pnpm build:web
      - name: Build server
        run: pnpm build:server