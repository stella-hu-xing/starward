name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck (web)
        run: pnpm typecheck:web
      - name: Lint (web)
        run: pnpm lint
      - name: Tests
        run: pnpm test
      - name: Build web app
        run: pnpm build:web