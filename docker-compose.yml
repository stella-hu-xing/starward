version: '3.8'

services:
  app:
    build: ./Dockerfile
    ports:
      - \"3000:3000\"
    volumes:
      - ./data:/data
      - ./config:/app/config:ro
      - ./logs:/app/logs
    environment:
      - PORT=3000
      - DATA_DIR=/data
      - APP_BASE_URL=https://app.stellahu.me
      - SESSION_SECRET=${SESSION_SECRET:-}
      - OWNER_EMAIL=${OWNER_EMAIL:-}
      - AUTH_MODE=${AUTH_MODE:-password_totp}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:-}
      - TIMEZONE=${TIMEZONE:-Australia/Melbourne}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-ap-southeast-2}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - BACKUP_RETENTION_COUNT=${BACKUP_RETENTION_COUNT:-30}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:stellahu.me}
      - MCP_BEARER_TOKEN=${MCP_BEARER_TOKEN:-}
      - HONEYCOMB_API_KEY=${HONEYCOMB_API_KEY:-}
    depends_on:
      - caddy

  caddy:
    image: caddy:latest
    ports:
      - \"80:80\"
      - \"443:443\"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/certificates:/etc/caddy/certificates
    depends_on:
      - app

volumes:
  data:
  logs:
